[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smithcode"
version = "0.5.0"
description = "终端 AI 编程助手"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]

[project.scripts]
smithcode = "smithcode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["smithcode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
