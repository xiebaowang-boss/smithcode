[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smithcode"
version = "0.8.0"
description = "终端 AI 编程助手"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "prompt_toolkit>=3.0",
    "textual>=0.80",
    "tomli>=2.0; python_version < '3.11'",
    "tomlkit>=0.13",
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]

[project.scripts]
smith = "smithcode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["smithcode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
