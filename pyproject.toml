# SmithCode monorepo
#
# 布局：
#   packages/core/      Python 包（smithcode）+ pytest 套件，uv 管理
#   packages/protocol/  事件协议 TS 类型 + JSON schema（占位，从 core 生成）
#   packages/desktop/   Tauri 2 桌面端（占位）

[project]
name = "smithcode-workspace"
version = "0.9.3"
description = "SmithCode monorepo（占位根，实际包在 packages/core）"
requires-python = ">=3.10"
dependencies = []

[tool.uv.workspace]
members = ["packages/core"]
